<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Talking AI Kids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FAVICON PHẢI Ở ĐÂY -->
  <link rel="icon" href="./favicon.ico">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      height:100vh;
      background: radial-gradient(circle at top, #1b2735, #090a0f);
    }

    .app{
      max-width:360px;
      margin:auto;
      padding:20px;
      text-align:center;
      color:#fff;
    }

    #bubble{
      background:rgba(255,255,255,0.1);
      padding:20px;
      border-radius:16px;
      font-size:18px;
      margin-top:30px;
    }

    .start-btn{
      position:fixed;
      inset:0;
      z-index:9999;
      background:linear-gradient(135deg,#ffb703,#fb8500);
      color:#fff;
      font-size:clamp(36px,8vw,64px);
      font-weight:900;
      border:none;
      cursor:pointer;
    }

    .start-btn.hide{ display:none; }

    .moon{
      position:fixed;
      top:30px;
      right:30px;
      width:100px;
      height:100px;
      border-radius:50%;
      background:radial-gradient(circle,#fff,#ccc);
      opacity:.8;
    }

    .stars{
      position:fixed;
      inset:0;
      background:
        radial-gradient(2px 2px at 20% 30%, #fff, transparent),
        radial-gradient(2px 2px at 70% 20%, #fff, transparent),
        radial-gradient(1px 1px at 50% 60%, #fff, transparent);
      opacity:.5;
    }
  </style>
</head>

<body>

<button id="startBtn" class="start-btn">
🌙 BẮT ĐẦU NGHE TRUYỆN
</button>

<div class="stars"></div>
<div class="moon"></div>

<div class="app">
  <div id="bubble">🌙 Bé sẵn sàng nghe truyện chưa?</div>

  <audio id="bgm" src="./kids-music.m4a"></audio>
  <audio id="tingSound" src="./ting.mp3"></audio>
</div>

<script src="./script.js"></script>

</body>
</html>
